subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    // Server/build target: latest Java LTS (25). The GWT terminal is transpiled
    // separately at -sourceLevel 17 (see :ponysdk gwtc task) — GWT's limit, unrelated
    // to the JVM that runs the build.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Sources are UTF-8 and some hold non-ASCII text. Without pinning the charset javac falls
    // back to the platform default, so the very same source compiles to different string
    // literals on a Windows workstation and on the Linux CI runner.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }

    // JDK 25's javadoc doclint is far stricter (rejects HTML heading jumps, etc.).
    // We still publish a javadoc jar, but doclint must not fail the build.
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}
