# Every dependency of the build, with its version, in one place.

[versions]
commons-fileupload2 = "2.0.0-M5" # latest milestone (no GA yet); verified to compile with the sample
commons-io = "2.22.0"
jakarta-json = "2.1.3"
jakarta-servlet = "6.1.0"
jakarta-validation = "3.1.1"
jakarta-websocket = "2.2.0"
jetty = "12.1.14"
jsoup = "1.23.2"
junit = "6.1.3"
log4j = "2.26.1"
mockito = "5.24.0"
node-gradle = "7.1.0"
opentelemetry = "1.67.0"
parsson = "1.1.9"
selenium = "4.51.0"
slf4j = "2.0.20"
spring = "7.0.10"
spring-boot = "4.1.2" # built on Spring Framework 7.0.10 and Jetty 12.1.14, the versions above
tyrus = "2.2.2"

[libraries]
commons-fileupload2-jakarta-servlet6 = { module = "org.apache.commons:commons-fileupload2-jakarta-servlet6", version.ref = "commons-fileupload2" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version.ref = "jakarta-json" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jakarta-websocket-client-api = { module = "jakarta.websocket:jakarta.websocket-client-api", version.ref = "jakarta-websocket" }
jetty-compression-gzip = { module = "org.eclipse.jetty.compression:jetty-compression-gzip", version.ref = "jetty" }
jetty-compression-server = { module = "org.eclipse.jetty.compression:jetty-compression-server", version.ref = "jetty" }
jetty-ee11-servlet = { module = "org.eclipse.jetty.ee11:jetty-ee11-servlet", version.ref = "jetty" }
jetty-ee11-websocket-jetty-server = { module = "org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jetty-server", version.ref = "jetty" }
jetty-http = { module = "org.eclipse.jetty:jetty-http", version.ref = "jetty" }
jetty-io = { module = "org.eclipse.jetty:jetty-io", version.ref = "jetty" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-util = { module = "org.eclipse.jetty:jetty-util", version.ref = "jetty" }
jetty-websocket-jetty-api = { module = "org.eclipse.jetty.websocket:jetty-websocket-jetty-api", version.ref = "jetty" }
jetty-websocket-jetty-client = { module = "org.eclipse.jetty.websocket:jetty-websocket-jetty-client", version.ref = "jetty" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
parsson = { module = "org.eclipse.parsson:parsson", version.ref = "parsson" }
selenium-api = { module = "org.seleniumhq.selenium:selenium-api", version.ref = "selenium" }
selenium-java = { module = "org.seleniumhq.selenium:selenium-java", version.ref = "selenium" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jcl-over-slf4j = { module = "org.slf4j:jcl-over-slf4j", version.ref = "slf4j" }
slf4j-jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }
spring-beans = { module = "org.springframework:spring-beans", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-boot-actuator-autoconfigure = { module = "org.springframework.boot:spring-boot-actuator-autoconfigure", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-jetty = { module = "org.springframework.boot:spring-boot-starter-jetty", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "spring-boot" }
spring-core = { module = "org.springframework:spring-core", version.ref = "spring" }
tyrus-client = { module = "org.glassfish.tyrus:tyrus-client", version.ref = "tyrus" }
tyrus-container-grizzly-client = { module = "org.glassfish.tyrus:tyrus-container-grizzly-client", version.ref = "tyrus" }
tyrus-extension-deflate = { module = "org.glassfish.tyrus.ext:tyrus-extension-deflate", version.ref = "tyrus" }

[bundles]
jetty-server = ["jetty-server", "jetty-ee11-servlet", "jetty-io", "jetty-util", "jetty-http", "jetty-websocket-jetty-api", "jetty-ee11-websocket-jetty-server", "jetty-compression-server", "jetty-compression-gzip"]
log4j-slf4j = ["slf4j-jcl-over-slf4j", "slf4j-jul-to-slf4j", "log4j-slf4j2-impl"]

[plugins]
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
