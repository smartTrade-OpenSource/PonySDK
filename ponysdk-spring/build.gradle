plugins {
    id 'jacoco'
}

def versionSuffix = project.hasProperty('BUILD_RELEASE') ? "" : "-SNAPSHOT"
group = 'com.ponysdk'
version = '3.0.0' + versionSuffix

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'ponysdk-spring'
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/smartTrade-OpenSource/PonySDK")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

dependencies {
    implementation project(':ponysdk')
    implementation libs.spring.core
    implementation libs.spring.beans
    implementation libs.spring.context
}

java {
    withJavadocJar()
    withSourcesJar()
}
