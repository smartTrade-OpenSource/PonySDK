ext {
    java2htmlVersion = '5.0'
    commonsBeanutilsVersion = '1.11.0'
    commonsIoVersion = '2.22.0'
    commonsFileupload2Version = '2.0.0-M5' // latest milestone (no GA yet); verified to compile with the sample
    jettyVersion = '12.1.14'
    springVersion = '7.0.10'
    jakartaServletVersion = '6.1.0'
    jakartaJsonVersion = '2.1.3'
    parssonVersion = '1.1.9'
    slf4jVersion = '2.0.20'
    log4jVersion = '2.26.1'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testRuntimeOnly 'org.eclipse.parsson:parsson:' + parssonVersion // jakarta.json 2.x impl (was javax-era glassfish 1.1.6)

    implementation(
            project(path: ':ponysdk', configuration: 'default'),
            'jakarta.json:jakarta.json-api:' + jakartaJsonVersion,
            'jakarta.servlet:jakarta.servlet-api:' + jakartaServletVersion,
            'org.slf4j:slf4j-api:' + slf4jVersion,
            'de.java2html:java2html:' + java2htmlVersion,
            'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:' + jettyVersion,
            'commons-beanutils:commons-beanutils:' + commonsBeanutilsVersion,
            'commons-io:commons-io:' + commonsIoVersion,
            'org.apache.commons:commons-fileupload2-jakarta-servlet6:' + commonsFileupload2Version,
            'com.google.code.gson:gson:2.15.0'
    )

    // Spring kept for the runFlexLayoutDemo task (FlexLayout E2E suite) — uses ponysdk-spring module
    implementation project(path: ':ponysdk-spring', configuration: 'default')

    runtimeOnly(
            'org.eclipse.parsson:parsson:' + parssonVersion,
            'de.java2html:java2html:' + java2htmlVersion,
            'org.springframework:spring-context:' + springVersion,
            'org.springframework:spring-aop:' + springVersion,
            'org.springframework:spring-expression:' + springVersion,
            'org.slf4j:jcl-over-slf4j:' + slf4jVersion,
            'org.slf4j:jul-to-slf4j:' + slf4jVersion,
            'org.apache.logging.log4j:log4j-api:' + log4jVersion,
            'org.apache.logging.log4j:log4j-core:' + log4jVersion,
            'org.apache.logging.log4j:log4j-slf4j2-impl:' + log4jVersion,
    )
}

// The classes of the sample's custom elements (script/webcomponents.js), from their manifest (ADR-0010)
def webComponents = tasks.register('webComponents', JavaExec) {
    description = 'Generates the Java classes of script/webcomponents.js from its Custom Elements Manifest'
    classpath = configurations.runtimeClasspath
    mainClass = 'com.ponysdk.core.tools.WebComponentGenerator'
    def manifest = file('src/main/resources/script/custom-elements.json')
    def output = layout.buildDirectory.dir('generated/sources/webcomponents')
    inputs.file(manifest).withPropertyName('manifest')
    outputs.dir(output)
    doFirst { output.get().asFile.deleteDir() } // an element removed from the manifest leaves no class behind
    argumentProviders.add({ [manifest.path, 'com.ponysdk.sample.client.wc', output.get().asFile.path] } as CommandLineArgumentProvider)
}
sourceSets.main.java.srcDir(webComponents)

// The portal shows the Java code behind its tickets: the sources themselves, beside its pages
processResources {
    from('src/main/java/com/ponysdk/sample/client') {
        include 'EmbeddedTicket.java', 'UISampleEntryPoint.java'
        into 'portal/source'
    }
}

def buildDirPath = layout.buildDirectory.get().asFile.absolutePath

task runShowcase(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    classpath += files(buildDirPath + '/resources/main')
    mainClass = 'com.ponysdk.impl.java.ShowcaseMain'
    jvmArgs = [
        '-Xmx1g',
        '-XX:+UseZGC',
        // Brotli HTTP compression loads a native lib (brotli4j); JDK 24+ (JEP 472) warns on native
        // access now and will block it later unless explicitly granted.
        '--enable-native-access=ALL-UNNAMED',
        '-Dlog4j.configurationFile=etc/log4j2.xml'
    ]
}

// The quick start of README.md and ARCHITECTURE.md: http://localhost:8080/hello/
task runQuickStart(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ponysdk.sample.quickstart.HelloWorldMain'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Dlog4j.configurationFile=etc/log4j2.xml']
}

// FlexLayout demo — activates the 'flexlayout' Spring profile (see etc/server_application.xml).
// Used by the Playwright E2E suite (sample/tests/flexlayout.spec.js) on http://localhost:8081/sample/.
task runFlexLayoutDemo(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    classpath += files(buildDirPath + '/resources')
    classpath += files(buildDirPath + '/resources/main')
    mainClass = 'com.ponysdk.impl.spring.MainSpring'
    jvmArgs = [
        '-Xmx2g',
        '--enable-native-access=ALL-UNNAMED',
        '-Dlog4j.configurationFile=etc/log4j2.xml',
        '-Dspring.profiles.active=flexlayout'
    ]
}

test {
    useJUnitPlatform()
}
