buildscript {
    // The node plugin's Jackson (2.14.2, 14 Dependabot alerts), raised for the build only, as in ponysdk/build.gradle
    dependencies {
        classpath(platform(libs.jackson.buildscript.bom))
    }
}

plugins {
    alias(libs.plugins.node.gradle)
}

dependencies {
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.core // PSuite's UIContext, which WaFieldsTest swaps the writer of
    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.parsson // jakarta.json 2.x impl (was javax-era glassfish 1.1.6)

    implementation(
            project(path: ':ponysdk', configuration: 'default'),
            libs.jakarta.json.api,
            libs.jakarta.servlet.api,
            libs.jakarta.validation.api, // the constraints of the Forms page's order
            libs.slf4j.api,
            libs.jetty.websocket.jetty.client,
            libs.commons.io,
            libs.commons.fileupload2.jakarta.servlet6
    )

    // Spring kept for the runFlexLayoutDemo task (FlexLayout E2E suite) — uses ponysdk-spring module
    implementation project(path: ':ponysdk-spring', configuration: 'default')

    runtimeOnly(
            libs.hibernate.validator, // Bean Validation for the Forms page, with its message interpolation
            libs.expressly,
            libs.parsson,
            libs.spring.context,
            libs.slf4j.jcl.over.slf4j,
            libs.slf4j.jul.to.slf4j,
            libs.log4j.api,
            libs.log4j.core,
            libs.log4j.slf4j2.impl
    )
}

// The classes of the sample's custom elements (script/webcomponents.js), from their manifest (ADR-0010)
def webComponents = tasks.register('webComponents', JavaExec) {
    description = 'Generates the Java classes of script/webcomponents.js from its Custom Elements Manifest'
    classpath = configurations.runtimeClasspath
    mainClass = 'com.ponysdk.core.tools.WebComponentGenerator'
    def manifest = file('src/main/resources/script/custom-elements.json')
    def output = layout.buildDirectory.dir('generated/sources/webcomponents')
    inputs.file(manifest).withPropertyName('manifest')
    outputs.dir(output)
    doFirst { output.get().asFile.deleteDir() } // an element removed from the manifest leaves no class behind
    argumentProviders.add({ [manifest.path, 'com.ponysdk.sample.client.wc', output.get().asFile.path] } as CommandLineArgumentProvider)
}
sourceSets.main.java.srcDir(webComponents)

// Web Awesome (docs/decisions/0028-web-awesome.md): a pinned npm dependency (package.json), installed by the build
// (Node comes from Gradle, as for the terminal; no network once npm's cache holds the package), copied to the served
// resources, and its Custom Elements Manifest turned into Java classes. No CDN at run time.
node {
    version = '24.22.1'
    download = true
    nodeProjectDir = projectDir
    npmInstallCommand = 'ci'
}
tasks.named('npmInstall') {
    args = ['--ignore-scripts', '--prefer-offline'] // a dependency's install script has no business in the build
}

def webAwesome = layout.projectDirectory.dir('node_modules/@awesome.me/webawesome')

// The bundled build (dist-cdn): every component a module of its own over shared chunks, served by the application's
// own origin as script/webawesome/**, loaded by script/webawesome-loader.js when a page that uses it is built
def webAwesomeFiles = tasks.register('webAwesomeFiles', Sync) {
    description = 'Copies the scripts and style sheets of Web Awesome to the served resources'
    dependsOn 'npmInstall'
    from(webAwesome.dir('dist-cdn')) {
        include '**/*.js', 'styles/**/*.css'
        exclude 'react/**', 'ssr/**', 'webawesome.ssr-loader.js'
        into 'script/webawesome'
    }
    from(webAwesome.file('LICENSE.md')) { into 'script/webawesome' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('generated/resources/webawesome')
}
sourceSets.main.resources.srcDir(webAwesomeFiles)

// The classes of its elements, from the library's own manifest (package.json: "customElements")
def webAwesomeClasses = tasks.register('webAwesomeClasses', JavaExec) {
    description = 'Generates the Java classes of Web Awesome from its Custom Elements Manifest'
    classpath = configurations.runtimeClasspath
    mainClass = 'com.ponysdk.core.tools.WebComponentGenerator'
    dependsOn 'npmInstall'
    def manifest = webAwesome.file('dist/custom-elements.json')
    def output = layout.buildDirectory.dir('generated/sources/webawesome')
    inputs.file(manifest).withPropertyName('manifest')
    outputs.dir(output)
    doFirst { output.get().asFile.deleteDir() }
    argumentProviders.add({ [manifest.asFile.path, 'com.ponysdk.sample.client.wa', output.get().asFile.path] } as CommandLineArgumentProvider)
}
sourceSets.main.java.srcDir(webAwesomeClasses)

// The code the showcase and the portal show is the code that runs: the sources themselves, on the classpath
processResources {
    from('src/main/java/com/ponysdk/sample/client') {
        include '*.java'
        into 'source' // the showcase's Code panels (Source.java)
    }
    from('src/main/java/com/ponysdk/sample/quickstart') {
        include '*.java'
        into 'source'
    }
    from('src/main/java/com/ponysdk/sample/client/wa') {
        include '*.java' // the adapters of Web Awesome's form controls (the generated classes are not sources of the repository)
        into 'source'
    }
    from('src/main/java/com/ponysdk/impl/java') {
        include 'ShowcaseMain.java' // its drain, shown by the Reconnection page
        into 'source'
    }
    from('src/main/java/com/ponysdk/sample/client') {
        include 'EmbeddedTicket.java', 'UISampleEntryPoint.java'
        into 'portal/source' // served by the portal
    }
}

def buildDirPath = layout.buildDirectory.get().asFile.absolutePath

def showcaseClasspath = sourceSets.main.runtimeClasspath + files(buildDirPath + '/resources/main')
def showcaseJvmArgs = ['-Xmx1g', '-XX:+UseZGC', '-Dlog4j.configurationFile=etc/log4j2.xml']

task runShowcase(type: JavaExec) {
    classpath = showcaseClasspath
    mainClass = 'com.ponysdk.impl.java.ShowcaseMain'
    jvmArgs = showcaseJvmArgs
    // ./gradlew :sample:runShowcase -Pdebug: the debug mode, its inspector on every page (Alt+Shift+I)
    if (project.hasProperty('debug')) systemProperty 'ponysdk.debug', 'true'
    // ./gradlew :sample:runShowcase -PhotReload: a page recompiled (the IDE, or compileJava) reloads in the browser
    if (project.hasProperty('hotReload')) systemProperty 'ponysdk.hotReload', 'true'
    // ./gradlew :sample:runShowcase -Pport=8091: another port, its portal on the next one
    if (project.hasProperty('port')) systemProperty 'ponysdk.port', project.property('port')
}

// Two showcase servers, on 8091 and 8093, behind a load balancer on http://localhost:8090/sample/ (scripts/two-servers.mjs).
// curl -X POST localhost:8090/lb/stop/a takes server a out of the balancer and sends it SIGTERM: its pages move to b.
def showcaseJava = javaToolchains.launcherFor(java.toolchain).map { it.executablePath.asFile.absolutePath }
tasks.register('runTwoServers', Exec) {
    dependsOn 'classes'
    workingDir = projectDir
    executable = 'node'
    args 'scripts/two-servers.mjs'
    argumentProviders.add({ [showcaseJava.get(), showcaseClasspath.asPath] + showcaseJvmArgs } as CommandLineArgumentProvider)
}

// The quick start of README.md and ARCHITECTURE.md: http://localhost:8080/hello/
task runQuickStart(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ponysdk.sample.quickstart.HelloWorldMain'
    jvmArgs = ['-Dlog4j.configurationFile=etc/log4j2.xml']
}

// The Spring Boot example (docs/guide/spring-boot.md): a source set and a classpath of its own, so that Boot's logging and
// its Jetty stay out of the showcase's. http://localhost:8185/hello/, or -Pport=<port>
sourceSets {
    springBoot
}
dependencies {
    springBootImplementation project(':ponysdk-spring-boot-starter')
    // The actuator over HTTP needs Spring MVC; PonySDK needs Jetty, so MVC comes without its Tomcat
    springBootImplementation libs.spring.boot.starter.actuator
    springBootImplementation(libs.spring.boot.starter.webmvc) {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
}
tasks.register('runSpringBoot', JavaExec) {
    classpath = sourceSets.springBoot.runtimeClasspath
    mainClass = 'com.ponysdk.sample.springboot.SpringBootSample'
    args "--server.port=${project.findProperty('port') ?: 8185}"
}
tasks.named('check') { dependsOn 'springBootClasses' } // the example compiles with the rest

// FlexLayout demo — activates the 'flexlayout' Spring profile (see etc/server_application.xml).
// Used by the Playwright E2E suite (sample/tests/flexlayout.spec.js) on http://localhost:8081/sample/.
task runFlexLayoutDemo(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    classpath += files(buildDirPath + '/resources')
    classpath += files(buildDirPath + '/resources/main')
    mainClass = 'com.ponysdk.impl.spring.MainSpring'
    jvmArgs = [
        '-Xmx2g',
        '-Dlog4j.configurationFile=etc/log4j2.xml',
        '-Dspring.profiles.active=flexlayout'
    ]
}

test {
    useJUnitPlatform()
}
