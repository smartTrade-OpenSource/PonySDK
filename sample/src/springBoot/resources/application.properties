# The Spring Boot example (docs/guide/spring-boot.md). The port is -Pport of :sample:runSpringBoot, 8185 by default.
spring.application.name=ponysdk-spring-boot-sample

# PonySDK: the application is served at http://localhost:8185/hello/
ponysdk.application-context-name=hello
ponysdk.application-name=Hello from Spring Boot

# The string dictionary is not kept in ./data, where the showcase keeps its own
ponysdk.string-dictionary.persistence=false

# On a graceful shutdown (Boot's default), the live pages move to the other servers over this time before the server stops
ponysdk.drain-timeout=5s
# The actuator's health, http://localhost:8185/actuator/health: ponysdk goes OUT_OF_SERVICE while the pages move
management.endpoint.health.show-details=always
