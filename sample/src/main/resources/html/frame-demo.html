<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PFrame demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #f8fafc; color: #334155;
               font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 28px 32px; }
  h1 { margin: 0 0 8px; font-size: 18px; color: #0f172a; letter-spacing: -.01em; }
  p { margin: 0; color: #64748b; max-width: 520px; }
  code { color: #4338ca; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>A page inside a PFrame</h1>
  <p>This document is loaded in an <code>&lt;iframe&gt;</code> created by <code>Element.newPFrame(url)</code>.
     Its URL, size and load events are driven from Java on the server.</p>
</main>
</body>
</html>
