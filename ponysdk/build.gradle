plugins {
    id 'jacoco'
}
ext {
    resourcesCoreTest = "src/test/resources"
    gwtOutputDirName = layout.buildDirectory.get().asFile.path + "/gwt"
    jsinteropVersion = '1.0.2'
    glassfishVersion = '1.1.6'
    jakartaValidationVersion = '3.1.1'
    seleniumVersion = '3.14.0'
    junitVersion = '4.12'
    tyrusVersion = '2.2.2'
    mockitoVersion = '5.20.0'
    gwtVersion = '2.9.0'
    elemental2Version = '1.1.0'
    jettyVersion = '12.1.13'
    springVersion = '7.0.9'
    jakartaServletVersion = '6.1.0'
    jakartaWebsocketClientVersion = '2.2.0'
    slf4jVersion = '2.0.16'
    log4jVersion = '2.26.1'
    jsonVersion = '1.1.6'
}

def versionSuffix = project.hasProperty('BUILD_RELEASE') ? "" : "-SNAPSHOT"
group = 'com.ponysdk'
version = '2.8.122' + versionSuffix

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'ponysdk'
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/smartTrade-OpenSource/PonySDK")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        xml.outputLocation = file("${layout.buildDirectory.get().asFile}/reports/jacoco/report.xml")
        html.required = false
        csv.required = false
    }
}

configurations {
    gwt
    gwtdev
    implementation.extendsFrom gwt
}

dependencies {
    gwt(
            'com.google.gwt:gwt-user:' + gwtVersion,
            'com.google.gwt:gwt-elemental:' + gwtVersion,
            'com.google.elemental2:elemental2-dom:' + elemental2Version
    )

    gwtdev(
            'com.google.gwt:gwt-dev:' + gwtVersion
    )

    implementation(
            'jakarta.validation:jakarta.validation-api:' + jakartaValidationVersion,
            'com.google.jsinterop:jsinterop:' + jsinteropVersion,
            'com.google.jsinterop:jsinterop-annotations:' + jsinteropVersion,
            'org.eclipse.jetty:jetty-server:' + jettyVersion,
            'org.eclipse.jetty.ee11:jetty-ee11-servlet:' + jettyVersion,
            'org.eclipse.jetty.ee11:jetty-ee11-webapp:' + jettyVersion,
            'org.eclipse.jetty:jetty-client:' + jettyVersion,
            'org.eclipse.jetty:jetty-io:' + jettyVersion,
            'org.eclipse.jetty:jetty-util:' + jettyVersion,
            'org.eclipse.jetty:jetty-http:' + jettyVersion,
            'org.eclipse.jetty:jetty-security:' + jettyVersion,
            'org.eclipse.jetty.websocket:jetty-websocket-jetty-api:' + jettyVersion,
            'org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jetty-server:' + jettyVersion,
            'org.eclipse.jetty.websocket:jetty-websocket-core-common:' + jettyVersion,
            'org.eclipse.jetty.websocket:jetty-websocket-core-server:' + jettyVersion,
            'org.springframework:spring-core:' + springVersion,
            'org.springframework:spring-web:' + springVersion,
            'org.springframework:spring-beans:' + springVersion,
            'org.springframework:spring-context:' + springVersion,
            'org.slf4j:slf4j-api:' + slf4jVersion,
            'jakarta.servlet:jakarta.servlet-api:' + jakartaServletVersion,
            'jakarta.json:jakarta.json-api:' + jsonVersion,
            'org.glassfish:jakarta.json:' + glassfishVersion,
            'org.seleniumhq.selenium:selenium-api:' + seleniumVersion,
            'org.glassfish.tyrus:tyrus-client:' + tyrusVersion,
            'org.glassfish.tyrus.ext:tyrus-extension-deflate:' + tyrusVersion,
            'junit:junit:' + junitVersion,
            'org.mockito:mockito-core:' + mockitoVersion
    )

    testImplementation(
            'org.seleniumhq.selenium:selenium-java:' + seleniumVersion,
            'jakarta.websocket:jakarta.websocket-client-api:' + jakartaWebsocketClientVersion,
            'org.jsoup:jsoup:1.14.3',
            'org.junit.jupiter:junit-jupiter-api:5.8.1',
            'org.junit.jupiter:junit-jupiter-engine:5.8.1',
            'org.junit.platform:junit-platform-engine:1.8.1',
            'org.junit.platform:junit-platform-launcher:1.8.1'
    )

    testRuntimeOnly(
            'org.slf4j:jcl-over-slf4j:' + slf4jVersion,
            'org.slf4j:log4j-over-slf4j:' + slf4jVersion,
            'org.slf4j:jul-to-slf4j:' + slf4jVersion,
            'org.apache.logging.log4j:log4j-slf4j2-impl:' + log4jVersion,
            'org.glassfish.tyrus:tyrus-container-grizzly-client:' + tyrusVersion
    )
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    classpath += configurations.gwtdev
    exclude '**/terminal/**'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// Both are resolved when the manifest is written, not at configuration time: running git eagerly
// is rejected by the configuration cache, and an eager timestamp would be frozen into its entry.
def gitRevision = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
    ignoreExitValue = true // keep the build usable outside a git checkout (source archive, export)
}.standardOutput.asText.map { it.trim() ?: 'unknown' }

def buildTimestamp = providers.provider {
    new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date())
}

jar {
    into('ponyterminal') {
        from gwtOutputDirName + '/gwt/ponyterminal'
    }
    exclude('*.devmode.js')
    exclude('*compilation-mappings.txt')

    // Also expose the js/css as a webjar so servlet containers can serve them straight from the jar
    with(copySpec {
        from("src/main/resources/script").into("META-INF/resources/webjars/ponysdk/${project.version}/")
        from("src/main/resources/style").into("META-INF/resources/webjars/ponysdk/${project.version}")
    })

    manifest {
        attributes(
                'Built-By': System.properties['user.name'],
                'Build-Timestamp': buildTimestamp,
                'Build-Revision': gitRevision,
                'Created-By': "Gradle ${gradle.gradleVersion}",
                'Build-Jdk': "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})",
                'Build-OS': "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}",
                'License-Title': "Apache License 2.0"
        )
    }
}

task gwtc(type: JavaExec) {
    inputs.dir('src/main/java/com/ponysdk/core/terminal')
    outputs.dir(gwtOutputDirName + '/gwt/ponyterminal')
    description = "GWT compile to JavaScript (production mode)"
    mainClass = 'com.google.gwt.dev.Compiler'
    workingDir = new File(gwtOutputDirName)
    classpath { [sourceSets.main.java.srcDirs, configurations.gwtdev, configurations.gwt] }
    maxHeapSize = '512M'
    args = [
            '-war',
            'gwt',
            '-localWorkers',
            Runtime.getRuntime().availableProcessors(),
            'com.ponysdk.core.PonyTerminal',
            '-generateJsInteropExports'
            // Debug Mode
            // '-style', 'DETAILED',
            // '-optimize', '0'
    ]
}

test {
    classpath = files(resourcesCoreTest, layout.buildDirectory.get().asFile.path + "/gwt") + classpath
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
        }
    }
}

check.dependsOn jacocoTestReport
gwtc.dependsOn classes
jar.dependsOn gwtc
// The test task adds the gwtc output dir (build/gwt) to its runtime classpath, so it consumes
// gwtc's output. Gradle 8.14 requires that implicit input/output relationship to be explicit.
test.dependsOn gwtc
publish.dependsOn check
