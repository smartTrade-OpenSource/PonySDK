import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'jacoco'
    id 'com.github.node-gradle.node' version '7.1.0'
}
ext {
    resourcesCoreTest = "src/test/resources"
    seleniumVersion = '4.51.0'
    junitVersion = '6.1.3'
    tyrusVersion = '2.2.2'
    mockitoVersion = '5.24.0'
    jettyVersion = '12.1.14'
    slf4jVersion = '2.0.20'
    log4jVersion = '2.26.1'
    jakartaServletVersion = '6.1.0'
    jakartaJsonVersion = '2.1.3'
    parssonVersion = '1.1.9'
    jakartaValidationVersion = '3.1.1'
    otelVersion = '1.67.0'
    // brotli4j, above the version jetty-compression-brotli brings: 1.24.0 bundles Brotli 1.2.1 (CVE-2026-111497)
    brotli4jVersion = '1.24.0'
}

def versionSuffix = project.hasProperty('BUILD_RELEASE') ? "" : "-SNAPSHOT"
// Optional local qualifier, e.g. -PVERSION_QUALIFIER=LD -> 3.0.0-LD-SNAPSHOT
def versionQualifier = project.hasProperty('VERSION_QUALIFIER') ? "-${project.property('VERSION_QUALIFIER')}" : ""
group = 'com.ponysdk'
version = '3.0.0' + versionQualifier + versionSuffix

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'ponysdk'
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/smartTrade-OpenSource/PonySDK")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

// Code excluded from coverage metrics & gate: the test harness shipped in main (com.ponysdk.test.*), test-support
// code, not product logic
def coverageExclusions = [
        'com/ponysdk/test/**',
]

jacocoTestReport {
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/report.xml")
        html.required = false
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
}

// Progressive coverage gate. Thresholds sit just below the current verified ratios so the build
// passes today; raise them incrementally as coverage improves (ratchet — never lower them).
jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        }))
    }
    violationRules {
        // Whole-module floor (over the testable code; the test harness is excluded above).
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.30
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.28
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
        // Per-package ratchets on the critical server packages: pin current line coverage so it
        // cannot silently regress. Raise these minimums as coverage improves (never lower them).
        rule {
            element = 'PACKAGE'
            includes = ['com.ponysdk.core.server.application']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.75 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.ponysdk.core.server.websocket']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.77 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.ponysdk.core.server.servlet']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.65 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.ponysdk.core.server.concurrent']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.70 }
        }
    }
}

// TypeScript terminal (docs/decisions/0002-javascript-terminal.md): sources in terminal/, Node provisioned by Gradle.
node {
    version = '24.22.1'
    download = true
    nodeProjectDir = file('terminal')
    npmInstallCommand = 'ci'
}

sourceSets {
    // Build tooling, not shipped: writes the terminal's protocol model from com.ponysdk.core.model
    generator {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def terminalModel = tasks.register('terminalModel', JavaExec) {
    description = 'Generates terminal/build/generated/model.ts from com.ponysdk.core.model'
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = 'com.ponysdk.generator.TerminalModelGenerator'
    def classes = sourceSets.main.java.destinationDirectory
    def output = layout.projectDirectory.file('terminal/build/generated/model.ts')
    inputs.files(classes.dir('com/ponysdk/core/model')).withPropertyName('modelClasses')
    outputs.file(output)
    argumentProviders.add({ [output.asFile.path, classes.get().asFile.path] } as CommandLineArgumentProvider)
}

def terminalSources = [file('terminal/src'), file('terminal/package.json'), file('terminal/package-lock.json'),
                       file('terminal/tsconfig.json'), file('terminal/build.mjs')]

def terminalCheck = tasks.register('terminalCheck', NpmTask) {
    description = 'Type-checks the TypeScript terminal'
    group = 'verification'
    dependsOn tasks.named('npmInstall'), terminalModel
    args = ['run', 'check']
    inputs.files(terminalSources, file('terminal/test'), terminalModel)
    def stamp = layout.buildDirectory.file('terminal/check.stamp')
    outputs.file(stamp)
    doLast { stamp.get().asFile.text = '' }
}

// Frames written by the real server write path, which the terminal's tests read (TerminalFixtures)
def terminalFixtures = tasks.register('terminalFixtures', JavaExec) {
    description = 'Writes terminal/build/fixtures: server frames for the tests of the TypeScript terminal'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ponysdk.core.server.websocket.TerminalFixtures'
    def output = layout.projectDirectory.dir('terminal/build/fixtures')
    inputs.files(sourceSets.main.output, sourceSets.test.output).withPropertyName('classes')
    outputs.dir(output)
    argumentProviders.add({ [output.asFile.path] } as CommandLineArgumentProvider)
}

def terminalTest = tasks.register('terminalTest', NpmTask) {
    description = 'Runs the unit tests of the TypeScript terminal on Node'
    group = 'verification'
    dependsOn tasks.named('npmInstall'), terminalModel, terminalFixtures
    args = ['run', 'test']
    inputs.files(terminalSources, file('terminal/test'), terminalModel, terminalFixtures)
    def stamp = layout.buildDirectory.file('terminal/test.stamp')
    outputs.file(stamp)
    doLast { stamp.get().asFile.text = '' }
}

def terminalBundle = tasks.register('terminalBundle', NpmTask) {
    description = 'Bundles the TypeScript terminal into terminal/build/dist/terminal.js'
    dependsOn tasks.named('npmInstall'), terminalModel
    args = ['run', 'bundle']
    inputs.files(terminalSources, terminalModel)
    outputs.dir('terminal/build/dist')
}

dependencies {
    implementation(
            'jakarta.validation:jakarta.validation-api:' + jakartaValidationVersion,
            // OpenTelemetry API — metrics + trace (no SDK, user brings their own)
            'io.opentelemetry:opentelemetry-api:' + otelVersion,
            'org.eclipse.jetty:jetty-server:' + jettyVersion,
            'org.eclipse.jetty.ee11:jetty-ee11-servlet:' + jettyVersion,
            'org.eclipse.jetty.ee11:jetty-ee11-webapp:' + jettyVersion,
            'org.eclipse.jetty.ee11:jetty-ee11-servlets:' + jettyVersion,
            'org.eclipse.jetty:jetty-client:' + jettyVersion,
            'org.eclipse.jetty:jetty-io:' + jettyVersion,
            'org.eclipse.jetty:jetty-util:' + jettyVersion,
            'org.eclipse.jetty:jetty-http:' + jettyVersion,
            'org.eclipse.jetty:jetty-security:' + jettyVersion,
            'org.eclipse.jetty.websocket:jetty-websocket-jetty-api:' + jettyVersion,
            'org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jetty-server:' + jettyVersion,
            'org.eclipse.jetty.compression:jetty-compression-server:' + jettyVersion,
            'org.eclipse.jetty.compression:jetty-compression-gzip:' + jettyVersion,
            'org.eclipse.jetty.compression:jetty-compression-brotli:' + jettyVersion,
            'com.aayushatharva.brotli4j:brotli4j:' + brotli4jVersion,
            'org.slf4j:slf4j-api:' + slf4jVersion,
            'jakarta.servlet:jakarta.servlet-api:' + jakartaServletVersion,
            'jakarta.json:jakarta.json-api:' + jakartaJsonVersion,
            'org.eclipse.parsson:parsson:' + parssonVersion,
            'org.seleniumhq.selenium:selenium-api:' + seleniumVersion,
            'org.glassfish.tyrus:tyrus-client:' + tyrusVersion,
            'org.glassfish.tyrus.ext:tyrus-extension-deflate:' + tyrusVersion,
            'org.junit.jupiter:junit-jupiter-api:' + junitVersion,
            'org.mockito:mockito-core:' + mockitoVersion
    )

    testImplementation(
            'org.junit.jupiter:junit-jupiter:' + junitVersion,
            'org.seleniumhq.selenium:selenium-java:' + seleniumVersion,
            'jakarta.websocket:jakarta.websocket-client-api:2.2.0',
            'org.jsoup:jsoup:1.23.2'
    )

    // Brotli native libraries (brotli4j) for the common server + dev platforms.
    // Optional at runtime: PonySDKServer registers Brotli only when the native is loadable
    // (Brotli4jLoader.isAvailable()), otherwise it degrades gracefully to gzip.
    runtimeOnly(
            'com.aayushatharva.brotli4j:native-linux-x86_64:' + brotli4jVersion,
            'com.aayushatharva.brotli4j:native-linux-aarch64:' + brotli4jVersion,
            'com.aayushatharva.brotli4j:native-osx-aarch64:' + brotli4jVersion,
            'com.aayushatharva.brotli4j:native-osx-x86_64:' + brotli4jVersion
    )

    testRuntimeOnly(
            'org.junit.platform:junit-platform-launcher:' + junitVersion,
            'org.slf4j:jcl-over-slf4j:' + slf4jVersion,
            'org.slf4j:jul-to-slf4j:' + slf4jVersion,
            'org.apache.logging.log4j:log4j-slf4j2-impl:' + log4jVersion,
            'org.glassfish.tyrus:tyrus-container-grizzly-client:' + tyrusVersion
    )
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

// Both are resolved when the manifest is written, not at configuration time: running git eagerly
// is rejected by the configuration cache, and an eager timestamp would be frozen into its entry.
def gitRevision = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
    ignoreExitValue = true // keep the build usable outside a git checkout (source archive, export)
}.standardOutput.asText.map { it.trim() ?: 'unknown' }

def buildTimestamp = providers.provider {
    new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date())
}

jar {
    into('ponyterminal') {
        from terminalBundle
    }

    // Also expose the js/css as a webjar so servlet containers can serve them straight from the jar
    with(copySpec {
        from("src/main/resources/script").into("META-INF/resources/webjars/ponysdk/${project.version}/")
        from("src/main/resources/style").into("META-INF/resources/webjars/ponysdk/${project.version}")
    })

    def builtBy = providers.systemProperty('user.name')
    def javaVersion = providers.systemProperty('java.version')
    def javaVendor = providers.systemProperty('java.vendor')
    def javaVmVersion = providers.systemProperty('java.vm.version')
    def osName = providers.systemProperty('os.name')
    def osArch = providers.systemProperty('os.arch')
    def osVersion = providers.systemProperty('os.version')
    def gradleVer = GradleVersion.current().version

    manifest {
        attributes(
                'Built-By': builtBy,
                'Build-Timestamp': buildTimestamp,
                'Build-Revision': gitRevision,
                'Created-By': "Gradle ${gradleVer}",
                'Build-Jdk': javaVersion.map { v -> "${v} (${javaVendor.get()} ${javaVmVersion.get()})" },
                'Build-OS': osName.map { n -> "${n} ${osArch.get()} ${osVersion.get()}" },
                'License-Title': "Apache License 2.0"
        )
    }
}

// Server write-path bench (protocol / wire bytes, CPU, allocations, heap): ./gradlew :ponysdk:bench [-Pbench.args=v1]
tasks.register('bench', JavaExec) {
    group = 'verification'
    description = 'Runs the protocol bench (ProtocolBench) on the real write path'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ponysdk.core.server.websocket.ProtocolBench'
    jvmArgs '-Xmx2g', '-XX:+UseParallelGC', '-Dorg.slf4j.simpleLogger.defaultLogLevel=warn'
    if (project.hasProperty('bench.args')) args project.property('bench.args').toString().split(' ')
    if (project.hasProperty('bench.jvm')) jvmArgs project.property('bench.jvm').toString().split(' ')
    ['bench.stats', 'bench.debug', 'bench.histo'].each { k -> if (project.hasProperty(k)) systemProperty k, 'true' }
}

test {
    useJUnitPlatform()
    classpath = files(resourcesCoreTest) + classpath
    // Brotli compression tests load a native lib (brotli4j); JDK 24+ (JEP 472) warns on native access
    // now and will block it later unless explicitly granted.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // Forward opt-in browser-test properties to the forked test JVM (see driver/BinaryAddonBrowserIT)
    ['ponysdk.browserTest', 'ponysdk.browserUrl', 'ponysdk.chromeBinary', 'webdriver.chrome.driver'].each { k ->
        if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
    }
    addTestListener(new TestListener() {
        @Override void beforeSuite(TestDescriptor descriptor) {}
        @Override void beforeTest(TestDescriptor descriptor) {}
        @Override void afterTest(TestDescriptor descriptor, TestResult result) {}
        @Override void afterSuite(TestDescriptor descriptor, TestResult result) {
            if (descriptor.parent == null) {
                println "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
            }
        }
    })
}

check.dependsOn jacocoTestReport, jacocoTestCoverageVerification, terminalCheck, terminalTest
publish.dependsOn check
