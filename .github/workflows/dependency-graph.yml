name: Dependency graph

# Submits the resolved Gradle dependencies to GitHub's dependency graph: Dependabot alerts on a vulnerable library
# (direct or transitive) only for the dependencies it can see.

on:
  push:
    branches: [master]

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@v5
