name: CI

on:
  push:
    branches: ['master', 'v2.8.x']
  pull_request:
    branches: ['master']

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build
        run: ./gradlew :sample:compileJava --no-daemon

      - name: Unit Tests (JUnit)
        run: ./gradlew :sample:test --no-daemon

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sample/package-lock.json

      - name: Install Playwright
        working-directory: sample
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # The demo server is started and stopped by Playwright itself, see
      # sample/playwright.config.js. Retries come from the same file.
      #
      # Visual snapshots are skipped here: the committed baselines were recorded on
      # chromium/win32 and this job runs on ubuntu, where font rendering differs enough
      # to report regressions that do not exist. Regenerate them per platform before
      # enabling, otherwise the suite fails for reasons unrelated to the change.
      - name: E2E Tests (Playwright)
        working-directory: sample
        run: npx playwright test tests/flexlayout.spec.js --ignore-snapshots

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            sample/test-results/
            sample/playwright-report/

  publish:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Publish
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon
