name: Browser Test (optional)

# Real-browser runtime check for the binary PAddOn protocol: the terminal's reader is unit-tested on Node,
# this checks the whole path in Chrome.
#
# This is a SEPARATE, NON-REQUIRED workflow on purpose: a failure here is visible but does not block
# the main "CI" build or PR merges (unless a maintainer explicitly marks it as a required check).

on:
  push:
  pull_request:

jobs:
  browser:
    name: Binary addon — real browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sample build
        run: ./gradlew :sample:classes :sample:processResources --stacktrace

      - name: Start the showcase server (background)
        run: |
          nohup ./gradlew :sample:runShowcase > showcase.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf http://localhost:8081/sample/ >/dev/null 2>&1 && { echo "server up after ${i}s"; break; }
            sleep 1
          done

      - name: Run the binary-addon browser test
        run: >-
          ./gradlew :ponysdk:test
          --tests "com.ponysdk.driver.BinaryAddonBrowserIT"
          -Dponysdk.browserTest=true
          --stacktrace

      - name: Showcase server log
        if: always()
        run: cat showcase.log || true
